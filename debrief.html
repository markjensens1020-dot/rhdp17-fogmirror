<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Morning Debrief · RHDP17</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b14;--card:rgba(255,255,255,.05);--line:rgba(255,255,255,.13);--line2:rgba(255,255,255,.26);--txt:#f4f8ff;--mut:#b4c0da;--dim:#6f7e9e;--gold:#f5b301;--cyan:#3fd8ff;--green:#2fe0a6;--purple:#9b8cff;--pink:#ff6aa6;--blue:#5a8dff;--orange:#ff7a4d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sora',sans-serif;background:radial-gradient(1100px 700px at 80% -10%,rgba(63,216,255,.10),transparent 55%),radial-gradient(900px 600px at -10% 110%,rgba(155,140,255,.12),transparent 55%),var(--bg);color:var(--txt);min-height:100vh;padding:22px 16px 60px}
.wrap{max-width:760px;margin:0 auto}
.fm-launch{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.fm-launch a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:#1c1f26;color:#fff;font-weight:700;font-size:12.5px;border-radius:10px;padding:8px 12px;border:1px solid rgba(255,255,255,.12)}
.hero{text-align:center;margin-bottom:18px}
.hero .logo{width:60px;height:60px;border-radius:16px;margin:0 auto 12px;background:conic-gradient(from 200deg,var(--gold),#ff7a4d,var(--pink),var(--purple),var(--cyan),var(--gold));display:flex;align-items:center;justify-content:center;box-shadow:0 0 34px rgba(245,179,1,.4)}
h1{font-family:'Fraunces',serif;font-weight:600;font-size:30px}
.sub{color:var(--mut);font-size:13px;margin-top:3px}
.modes{display:flex;gap:8px;justify-content:center;margin:16px 0}
.modes button{font-family:inherit;font-weight:700;font-size:13.5px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 16px;cursor:pointer}
.modes button.on{background:linear-gradient(135deg,var(--cyan),var(--green));color:#06121a;border-color:transparent}
.start{display:block;width:100%;max-width:420px;margin:6px auto 4px;background:linear-gradient(135deg,var(--gold),var(--orange));color:#10131c;font-family:inherit;font-weight:800;font-size:18px;border:none;border-radius:15px;padding:18px;cursor:pointer;box-shadow:0 12px 30px rgba(245,179,1,.25)}
.start:disabled{opacity:.6;cursor:default}
.opt{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mut);font-size:12.5px;margin:10px 0 2px}
.sec{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:16px;padding:16px 18px;margin-top:13px;opacity:.5;transition:.25s}
.sec.on{opacity:1;border-color:var(--c);box-shadow:0 0 40px -12px var(--c)}
.sec .who{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.sec .av{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;background:linear-gradient(135deg,var(--c),rgba(255,255,255,.14));flex:0 0 auto}
.sec .nm{font-size:15px;font-weight:800}.sec .tt{font-size:12px;color:var(--mut)}
.sec .spk{margin-left:auto;font-size:12px;color:var(--c);font-weight:700}
.sec ul{margin:0 0 0 16px;font-size:13.5px;line-height:1.6;color:var(--txt)}
.sec li{margin:4px 0}
.note{text-align:center;color:var(--dim);font-size:11.5px;margin-top:18px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="fm-launch">
    <a href="./index.html">⌂ Dashboard</a>
    <a href="https://outlook.office.com/mail/" target="_blank" rel="noopener">📥 Outlook</a>
    <a href="https://teams.microsoft.com/" target="_blank" rel="noopener">💬 Teams</a>
    <a href="https://outlook.office.com/calendar/view/week" target="_blank" rel="noopener">📅 Calendar</a>
    <a href="./portals.html">🏛️ Portals</a>
  </div>
  <div class="hero">
    <div class="logo"><img src="./icons/logo.svg" alt="RHDP17" style="width:40px;height:40px;filter:invert(1)"></div>
    <h1 id="title">Morning Debrief</h1>
    <div class="sub">RHDP17 · the crew briefs you on the day — out loud</div>
  </div>
  <div class="modes">
    <button class="on" data-m="morning">🌅 Morning</button>
    <button data-m="endofday">🌙 End of day</button>
  </div>
  <button class="start" id="start">▶ Start the debrief</button>
  <label class="opt"><input type="checkbox" id="speak" checked> Bots speak out loud</label>
  <div id="out"></div>
  <div class="note">Tip: open this each morning when you log on. It reads from live projects, mail, approvals, balances, appointments and permits — and fills in more as the day moves.</div>
</div>
<script>
const SUPA="https://qrwlyowdzqzkibdzvoek.supabase.co";
const ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFyd2x5b3dkenF6a2liZHp2b2VrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAyNDIyODEsImV4cCI6MjA4NTgxODI4MX0.5xurzQ0HUECk4_SxlcRdKG-5KCmyQ30b4jyCiyERAoU";
const $=id=>document.getElementById(id);
const META={'Mark Jensen AI':{c:'var(--blue)',f:'🧭'},'Richard Haro AI':{c:'var(--gold)',f:'📐'},'Irma Haro AI':{c:'var(--pink)',f:'🛡️'},'Cassie AI':{c:'var(--orange)',f:'🗂️'},'Bookkeeper Maya AI':{c:'var(--green)',f:'📒'},'Raymond AI':{c:'var(--cyan)',f:'🏛️'}};
let mode='morning', running=false;
const esc=s=>(s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.modes button').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.m;$('title').textContent=mode==='morning'?'Morning Debrief':'End-of-Day Report';$('start').textContent=mode==='morning'?'▶ Start the debrief':'▶ Start end-of-day report';});
function cards(sections){
  $('out').innerHTML=sections.map((s,i)=>{const m=META[s.bot]||{c:'var(--cyan)',f:'🤖'};
   return `<div class="sec" id="sec${i}" style="--c:${m.c}"><div class="who"><div class="av">${m.f}</div><div><div class="nm">${esc(s.bot)}</div><div class="tt">${esc(s.title)}</div></div><div class="spk" id="spk${i}"></div></div><ul>${(s.lines||[]).map(l=>'<li>'+esc(l)+'</li>').join('')}</ul></div>`;
  }).join('');
}
async function speak(bot,text){
  try{const r=await fetch(SUPA+'/functions/v1/elevenlabs-tts',{method:'POST',headers:{'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+ANON},body:JSON.stringify({bot,text})});
   if(!r.ok)throw 0;const b=await r.blob();const a=new Audio(URL.createObjectURL(b));
   await new Promise(res=>{a.onended=res;a.onerror=res;a.play().catch(res);});
  }catch(_){await new Promise(res=>setTimeout(res,1200));}
}
$('start').onclick=async()=>{
  if(running)return;running=true;$('start').disabled=true;$('start').textContent='Loading…';
  let data;
  try{const r=await fetch(SUPA+'/functions/v1/debrief?mode='+mode+'&x='+Date.now(),{headers:{apikey:ANON,Authorization:'Bearer '+ANON}});data=await r.json();}
  catch(e){$('out').innerHTML='<div class="sec on" style="--c:var(--pink)">Could not load the debrief. Please try again.</div>';running=false;$('start').disabled=false;$('start').textContent='▶ Start the debrief';return;}
  const sections=data.sections||[];cards(sections);
  $('start').textContent='🔊 Playing…';
  const speakOn=$('speak').checked;
  for(let i=0;i<sections.length;i++){
   document.querySelectorAll('.sec').forEach(x=>x.classList.remove('on'));
   const el=$('sec'+i);if(el){el.classList.add('on');el.scrollIntoView({behavior:'smooth',block:'center'});}
   if(speakOn){$('spk'+i).textContent='● speaking';await speak(sections[i].bot,sections[i].speech);$('spk'+i).textContent='✓';}
   else{await new Promise(res=>setTimeout(res,900));}
  }
  document.querySelectorAll('.sec').forEach(x=>x.classList.add('on'));
  running=false;$('start').disabled=false;$('start').textContent='↻ Play again';
};
</script>
<script src="./fogwidget.js"></script>
<script src="./authgate.js" defer></script>
</body>
</html>
