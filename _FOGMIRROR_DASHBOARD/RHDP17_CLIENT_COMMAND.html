<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>RHDP17 — Client Command</title>
<style>
 *{box-sizing:border-box}
 body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0b1220;color:#e8eef8;height:100vh;display:flex;flex-direction:column}
 .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 20px;background:#0e1b31;border-bottom:1px solid #26406a}
 .bar b{font-size:16px;letter-spacing:.4px;color:#fff}
 .bar label{font-size:12px;font-weight:800;color:#9fb8e6;letter-spacing:.5px}
 select{background:#0a101d;color:#dfe7f3;border:1px solid #4a7bd0;border-radius:9px;padding:9px 14px;font-size:14px;min-width:240px}
 input{background:#0a101d;color:#dfe7f3;border:1px solid #4a7bd0;border-radius:9px;padding:9px 12px;font-size:13px;width:200px}
 iframe{flex:1;width:100%;border:none;background:#fff}
 .hint{font-size:11.5px;color:#8aa0c8}
</style></head><body>
<div class="bar">
 <b>📁 CLIENT COMMAND</b>
 <label>PICK A CLIENT:</label>
 <input id="search" placeholder="Type to filter…" oninput="filt()">
 <select id="sel" onchange="load(this.value)"><option value="Balcunas">Balcunas</option><option value="Bocian">Bocian</option><option value="Buddhist_Temple_Huyen_Khong">Buddhist Temple Huyen Khong</option><option value="Castro">Castro</option><option value="Chang">Chang</option><option value="Chung">Chung</option><option value="Eckinger">Eckinger</option><option value="Haraguchi">Haraguchi</option><option value="Hsieh">Hsieh</option><option value="Kurt_Apen">Kurt Apen</option><option value="Loukanov">Loukanov</option><option value="Orquidea_Negrete">Orquidea Negrete</option><option value="Sanchez">Sanchez</option><option value="Tavares_Uvas_Rd">Tavares Uvas Rd</option><option value="Tolentino">Tolentino</option></select>
 <span class="hint">Their whole file loads below — page through it, search their documents. Switch clients anytime, no list.</span>
</div>
<iframe id="frame" src="Balcunas/Balcunas_Client_Packet.html"></iframe>
<script>
var opts=[].slice.call(document.querySelectorAll('#sel option'));
function load(c){if(!c)return;document.getElementById('frame').src=c+'/'+c+'_Client_Packet.html';}
function filt(){var q=document.getElementById('search').value.toLowerCase();var sel=document.getElementById('sel');sel.innerHTML='';opts.forEach(function(o){if(o.text.toLowerCase().indexOf(q)>=0)sel.appendChild(o.cloneNode(true));});if(sel.options.length){sel.selectedIndex=0;load(sel.value);}}
</script>
</body></html>
