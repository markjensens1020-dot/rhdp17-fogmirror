<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sora',system-ui,Arial,sans-serif;background:radial-gradient(1100px 700px at 85% -12%,#1b1136,transparent 55%),radial-gradient(900px 600px at -10% 110%,rgba(94,200,240,.08),transparent 55%),#070b14;color:#fff;padding:18px 18px 90px;min-height:100vh}
.wrap{max-width:1160px;margin:0 auto}
.fm-launch{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.fm-launch a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:#1c1f26;color:#fff;font-weight:800;font-size:15px;border-radius:13px;padding:14px 22px;border:1px solid rgba(255,255,255,.14)}
.fm-launch a:hover{background:#2a2f3a}
.bots{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;margin:0 0 22px}
.bots .lbl{width:100%;font-size:11px;letter-spacing:2px;color:#9fb8e6;font-weight:800;margin-bottom:4px}
.bots a{text-decoration:none;text-align:center;color:#dfe7f3;width:74px}
.bots img{width:66px;height:66px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.25);display:block;margin:0 auto 6px}
.bots a:hover img{border-color:#5ec8f0;transform:translateY(-2px)}
.bots span{font-size:12.5px;font-weight:700}
.custhead{background:linear-gradient(135deg,rgba(94,200,240,.16),rgba(155,140,255,.12));border:1px solid rgba(255,255,255,.24);border-radius:18px;padding:22px 26px;margin-bottom:24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.custhead .lbl{font-size:11px;letter-spacing:2.5px;color:#9fb8e6;font-weight:800}
.custhead input{flex:1;min-width:240px;background:#0a101d;color:#fff;border:1px solid #4a7bd0;border-radius:10px;padding:14px 16px;font-size:16px;font-family:inherit}
.custhead .cur{min-width:220px}
.custhead .cur .nm{font-family:'Fraunces',serif;font-size:34px;font-weight:600;color:#fff;line-height:1.05}
.custhead .cur small{display:block;font-size:12.5px;color:#9fb0cc;font-weight:500;margin-top:4px}
.proc{background:rgba(12,19,34,.55);border:1px solid rgba(255,255,255,.10);border-left:7px solid var(--c);border-radius:18px;padding:20px 24px;margin-bottom:20px}
.proc .ph{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.proc h2{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--c)}
.proc h2 a{color:inherit;text-decoration:none}
.proc .now{font-size:13px;color:#9fb0cc;font-weight:600}
.proc .now b{color:var(--c)}
/* the big color-coded status bar */
.bar{display:flex;gap:4px;width:100%}
.seg{flex:1;min-width:0;height:58px;border-radius:10px;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0 6px;transition:.15s;overflow:visible}
.seg:hover{transform:translateY(-2px)}
.seg .lab{font-size:11px;font-weight:800;color:#08101c;text-align:center;line-height:1.15;letter-spacing:.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.seg.up .lab{color:#aeb9d0}
.seg.cur{outline:3px solid #fff;outline-offset:2px;z-index:2}
.seg .tick{position:absolute;top:5px;left:7px;font-size:11px;font-weight:900;color:#08101c}
/* hover popover — the tools for that step */
.seg .pop{display:none;position:absolute;bottom:68px;left:50%;transform:translateX(-50%);width:230px;background:#0d1728;border:1px solid var(--c);border-radius:12px;padding:13px 14px;z-index:20;text-align:left;box-shadow:0 16px 40px rgba(0,0,0,.6)}
.seg:hover .pop{display:block}
.seg .pop:after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--c)}
.seg .pop .pt{font-size:12px;font-weight:800;color:var(--c);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.seg .pop ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.seg .pop li{font-size:12.5px;color:#dfe7f3;line-height:1.3;padding-left:14px;position:relative}
.seg .pop li:before{content:'▸';position:absolute;left:0;color:var(--c)}
.seg .pop a{color:#fff;text-decoration:underline;font-weight:700}
.hint{font-size:12.5px;color:#7c89a4;text-align:center;margin-top:20px;font-weight:300}
</style></head><body>
<div class="wrap">
<div class="fm-launch">
 <a href="https://outlook.office.com/mail/drafts" target="_blank" rel="noopener">📝 Drafts</a><a href="./forms.html">📋 Forms</a><a href="./mic.html">🎙️ Fog Mirror</a>
</div>
<div class="bots">
 <div class="lbl">💬 TALK TO A BOT — click a face</div>

</div>
<div id="stack"></div>
<div class="hint">Hover any step to see the tools you need for it · Design reflects live data · other processes fill in as each project reaches them.</div>
</div>
<script>
var A="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFyd2x5b3dkenF6a2liZHp2b2VrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAyNDIyODEsImV4cCI6MjA4NTgxODI4MX0.5xurzQ0HUECk4_SxlcRdKG-5KCmyQ30b4jyCiyERAoU";
// order: Design -> Construction -> Bidding(subs) -> Selection Board
var PROC=[
 {name:'Design',href:'./design.html',hue:140,cur:3,steps:[
   {l:'Intake',t:['<a href="./forms/01-client-intake.html">Client Intake form</a>','Retainer &amp; contract','Open client folder']},
   {l:'Measure',t:['Site photos &amp; measurements','Existing plans','Scan files']},
   {l:'Concept',t:['<a href="./forms/03-design-binder.html">Design binder</a>','Concept drawings','Client feedback']},

   {l:'Inspections',t:['Inspection schedule','City inspector']},
   {l:'Final',t:['Final inspection','Punch list','Close-out']}
 ]},
 {name:'Bidding · Subcontractors',href:'./bidmanager.html',hue:208,cur:-1,steps:[

 ]},
 {name:'Bookkeeping',href:'./billing.html',hue:270,cur:-1,steps:[

   {l:'Paid / Closed',t:['Record payment','Receipts','Month-end close']}
 ]}
];
function cc(state,hue){ if(state==='up')return 'hsl('+hue+',30%,22%)'; var gold=hue===40; if(state==='cur')return 'hsl('+hue+','+(gold?92:84)+'%,'+(gold?54:57)+'%)'; return 'hsl('+hue+','+(gold?88:80)+'%,'+(gold?47:50)+'%)'; }
function render(){ document.getElementById('stack').innerHTML=PROC.map(function(p){
  var accent='hsl('+p.hue+','+(p.hue===40?86:70)+'%,'+(p.hue===40?54:58)+'%)';
  var started=p.cur>=0;
  var nowLabel = started ? ('On step: <b>'+p.steps[Math.min(p.cur,p.steps.length-1)].l+'</b>') : 'Not started yet';
  var segs=p.steps.map(function(s,i){
    var st=i<p.cur?'done':(i===p.cur?'cur':'up'); var mk=st==='done'?'✓':(st==='cur'?'●':'');
    var tips=s.t.map(function(x){return '<li>'+x+'</li>';}).join('');
    return '<div class="seg '+st+'" style="background:'+cc(st,p.hue)+'">'
      +(mk?'<span class="tick">'+mk+'</span>':'')
      +'<span class="lab">'+s.l+'</span>'
      +'<div class="pop"><div class="pt">'+s.l+'</div><ul>'+tips+'</ul></div>'
    +'</div>';
  }).join('');
  return '<div class="proc" style="--c:'+accent+'"><div class="ph"><h2><a href="'+p.href+'">'+p.name+' <span style="opacity:.55;font-size:16px">↗</span></a></h2><div class="now">'+nowLabel+'</div></div><div class="bar">'+segs+'</div></div>';
}).join(''); }
render();
(function(){var sel=document.getElementById('custSel');var ap="";
 try{ap=localStorage.getItem('rhdp17_active_project')||"";}catch(e){}
 fetch("https://qrwlyowdzqzkibdzvoek.supabase.co/functions/v1/dashboard-data",{headers:{apikey:A,Authorization:"Bearer "+A}}).then(function(r){return r.json();}).then(function(d){ if(!d||!d.projects)return; window._proj=d.projects; var names=Array.from(new Set(d.projects.map(function(p){return p.name;}))).sort(); document.getElementById('custList').innerHTML=names.map(function(n){return '<option value="'+n+'">';}).join(''); if(ap){sel.value=ap;pick(ap);} }).catch(function(){});
 sel.addEventListener('change',function(){pick(sel.value);}); sel.addEventListener('keydown',function(e){if(e.key==='Enter')pick(sel.value);});
 function pick(v){ if(!v)return; var r=(window._proj||[]).filter(function(p){return p.name.toLowerCase()===v.toLowerCase();})[0]||(window._proj||[]).filter(function(p){return p.name.toLowerCase().indexOf(v.toLowerCase())>=0;})[0]; var nm=r?r.name:v; document.getElementById('curName').textContent=nm; try{localStorage.setItem('rhdp17_active_project',nm);}catch(e){} if(r){ document.getElementById('curSub').textContent='Design: '+(r.phase||'in progress')+' · '+(r.pct||0)+'% overall'; PROC[0].cur=Math.max(0,Math.min(PROC[0].steps.length-1,Math.round((r.pct||0)/100*(PROC[0].steps.length-1)))); } else { document.getElementById('curSub').textContent='all their processes, stacked below'; } render(); }
})();
</script>
