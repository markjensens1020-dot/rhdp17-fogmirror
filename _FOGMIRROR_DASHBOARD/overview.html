<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Overview · RHDP17</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sora',system-ui,Arial,sans-serif;background:radial-gradient(1100px 700px at 85% -12%,#1b1136,transparent 55%),radial-gradient(900px 600px at -10% 110%,rgba(94,200,240,.08),transparent 55%),#070b14;color:#fff;padding:18px 18px 80px;min-height:100vh}
.wrap{max-width:1120px;margin:0 auto}
.fm-launch{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.fm-launch a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:#1c1f26;color:#fff;font-weight:700;font-size:12.5px;border-radius:10px;padding:8px 12px;border:1px solid rgba(255,255,255,.12)}
.custhead{background:linear-gradient(135deg,rgba(94,200,240,.16),rgba(155,140,255,.12));border:1px solid rgba(255,255,255,.24);border-radius:18px;padding:20px 24px;margin-bottom:22px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.custhead .lbl{font-size:11px;letter-spacing:2.5px;color:#9fb8e6;font-weight:800}
.custhead input{flex:1;min-width:220px;background:#0a101d;color:#fff;border:1px solid #4a7bd0;border-radius:10px;padding:13px 15px;font-size:15px;font-family:inherit}
.custhead .cur{min-width:220px}
.custhead .cur .nm{font-family:'Fraunces',serif;font-size:32px;font-weight:600;color:#fff;line-height:1.05}
.custhead .cur small{display:block;font-size:12px;color:#9fb0cc;font-weight:500;margin-top:4px}
.proc{background:rgba(12,19,34,.6);border:1px solid rgba(255,255,255,.10);border-left:6px solid var(--c);border-radius:16px;padding:16px 20px;margin-bottom:16px}
.proc .ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.proc h2{font-family:'Fraunces',serif;font-size:22px;font-weight:600;color:var(--c)}
.proc .pct{font-size:26px;font-weight:800;color:var(--c)}.proc .pct small{font-size:12px;color:#8aa0c8;font-weight:600;letter-spacing:1px}
.track{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tlc{flex:1 1 0;min-width:70px;text-align:center}
.tlc .cell{height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;color:#08101c;font-weight:800}
.tlc.cur .cell{outline:2px solid #fff;outline-offset:2px}
.tlc .lab{font-size:9px;color:#c8d4ee;margin-top:6px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{font-size:11px;color:#7c89a4;margin-top:9px;font-weight:300}
.hint{font-size:12px;color:#7c89a4;text-align:center;margin-top:18px;font-weight:300}
</style></head><body>
<div class="wrap">
<div class="fm-launch">
 <a href="./index.html">⌂ Command Center</a><a href="./design.html">✏️ Design</a><a href="./construction.html">🏗️ Construction</a><a href="./bidmanager.html">🏆 Bidding</a><a href="./selectionboard.html">🎨 Selections</a><a href="./clients.html">🪞 Clients</a>
</div>
<div class="custhead">
  <div class="lbl">CUSTOMER</div>
  <input id="custSel" list="custList" placeholder="Type a customer name…" autocomplete="off">
  <datalist id="custList"></datalist>
  <div class="cur"><div class="nm" id="curName">Pick a customer ↑</div><small id="curSub">then see all their processes stacked below</small></div>
</div>
<div id="stack"></div>
<div class="hint">All processes shown per customer · Design reflects live data · other processes fill in as each project reaches them.</div>
</div>
<script>
var A="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFyd2x5b3dkenF6a2liZHp2b2VrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAyNDIyODEsImV4cCI6MjA4NTgxODI4MX0.5xurzQ0HUECk4_SxlcRdKG-5KCmyQ30b4jyCiyERAoU";
var PROC=[
 {name:'Design',hue:140,cur:3,pct:45,steps:['Intake','Measure/Scan','Concept','Selections','Working Dwgs','Engineering','Plan Set','Submit']},
 {name:'Selections',hue:40,cur:1,pct:20,steps:['Kickoff','Room-by-Room','Vendor Quotes','Client Approval','Ordered']},
 {name:'Bidding',hue:208,cur:0,pct:5,steps:['Scope','Invite Subs','Collect Bids','Compare','Award','Contracts']},
 {name:'Construction',hue:345,cur:-1,pct:0,steps:['Site Prep','Foundation','Framing','Rough Trades','Finishing','Inspections','Final']}
];
function cc(state,hue){ if(state==='up')return 'hsl('+hue+',32%,22%)'; var gold=hue===40; if(state==='cur')return 'hsl('+hue+','+(gold?90:82)+'%,'+(gold?52:56)+'%)'; return 'hsl('+hue+','+(gold?88:80)+'%,'+(gold?46:50)+'%)'; }
function render(){ document.getElementById('stack').innerHTML=PROC.map(function(p){
  var tiles=p.steps.map(function(s,i){ var st=i<p.cur?'done':(i===p.cur?'cur':'up'); var mk=st==='done'?'✓':(st==='cur'?'●':''); return '<div class="tlc '+(st==='cur'?'cur':'')+'"><div class="cell" style="background:'+cc(st,p.hue)+'">'+mk+'</div><div class="lab">'+s+'</div></div>'; }).join('');
  var started=p.cur>=0; var accent='hsl('+p.hue+','+(p.hue===40?86:70)+'%,'+(p.hue===40?52:56)+'%)';
  return '<div class="proc" style="--c:'+accent+'"><div class="ph"><h2>'+p.name+'</h2><div class="pct">'+(started?p.pct:'—')+(started?'<small>%</small>':'')+'</div></div><div class="track">'+tiles+'</div>'+(started?'':'<div class="note">Not started yet for this customer.</div>')+'</div>';
}).join(''); }
render();
(function(){var sel=document.getElementById('custSel');var ap="";
 try{ap=localStorage.getItem('rhdp17_active_project')||"";}catch(e){}
 fetch("https://qrwlyowdzqzkibdzvoek.supabase.co/functions/v1/dashboard-data",{headers:{apikey:A,Authorization:"Bearer "+A}}).then(function(r){return r.json();}).then(function(d){ if(!d||!d.projects)return; window._proj=d.projects; var names=Array.from(new Set(d.projects.map(function(p){return p.name;}))).sort(); document.getElementById('custList').innerHTML=names.map(function(n){return '<option value="'+n+'">';}).join(''); if(ap){sel.value=ap;pick(ap);} }).catch(function(){});
 sel.addEventListener('change',function(){pick(sel.value);}); sel.addEventListener('keydown',function(e){if(e.key==='Enter')pick(sel.value);});
 function pick(v){ if(!v)return; var r=(window._proj||[]).filter(function(p){return p.name.toLowerCase()===v.toLowerCase();})[0]||(window._proj||[]).filter(function(p){return p.name.toLowerCase().indexOf(v.toLowerCase())>=0;})[0]; var nm=r?r.name:v; document.getElementById('curName').textContent=nm; try{localStorage.setItem('rhdp17_active_project',nm);}catch(e){} if(r){ document.getElementById('curSub').textContent='Design: '+(r.phase||'in progress')+' · '+(r.pct||0)+'% overall'; PROC[0].pct=r.pct||0; PROC[0].cur=Math.max(0,Math.min(PROC[0].steps.length-1,Math.round((r.pct||0)/100*(PROC[0].steps.length-1)))); } else { document.getElementById('curSub').textContent='all their processes, stacked below'; } render(); }
})();
</script>
<script src="./authgate.js" defer></script>
</body></html>
